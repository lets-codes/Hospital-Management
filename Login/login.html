<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        /* 
         * Reusable Login CSS 
         * Customize colors using the CSS variables below.
         */
        :root {
            --primary-color: #4a90e2;
            --primary-hover: #357abd;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #e1e4e8;
            --radius: 8px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
        }

        .login-card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .login-header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .password-wrap {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
            padding: 6px;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .forgot-password {
            color: var(--primary-color);
            text-decoration: none;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .login-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
        }

        .login-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .top-nav {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hospital-logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
        }

        .nav-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="hospital_landing.html" class="hospital-logo">🏥 Hospital and community Pharmacy management</a>
        <div class="nav-links">
            <a href="hospital_landing.html">Home</a>
            <a href="signup.html">Sign Up</a>
        </div>
    </div>
    <div class="login-container">
        <div class="login-card">
            <div id="login-step">
                <div class="login-header">
                    <h1>Welcome Back</h1>
                    <p>Enter your credentials to access your account</p>
                </div>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-input" placeholder="name@company.com" required>
                    </div>
                    <div class="form-group password-wrap">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" aria-label="Toggle password">Show</button>
                    </div>
                    <div class="form-actions">
                        <label style="display: flex; align-items: center; cursor: pointer;">
                            <input type="checkbox" style="margin-right: 8px;"> Remember me
                        </label>
                        <a href="forgot_password.html" class="forgot-password">Forgot password?</a>
                    </div>
                    <div id="error-message" style="color: #e74c3c; margin-bottom: 10px; text-align: center; min-height: 20px;"></div>
                    <button type="submit" class="btn-submit">Sign In</button>
                </form>
                <div class="login-footer">
                    <p>Don't have an account? <a href="signup.html" style="font-size: 16px; font-weight: bold;">Sign up here →</a></p>
                </div>
            </div>

            <div id="otp-step" style="display: none;">
                <div class="login-header">
                    <h1>Verification</h1>
                    <p>Enter the OTP sent to your email</p>
                </div>
                <form id="otpForm">
                    <div class="form-group">
                        <label for="otp" class="form-label">One-Time Password</label>
                        <input type="text" id="otp" class="form-input" placeholder="123456" required style="text-align: center; letter-spacing: 2px;">
                    </div>
                    <button type="submit" class="btn-submit">Verify & Login</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // API URL configuration - Always use localhost:5000
        const API_URL = 'http://localhost:5000';

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.querySelector('.btn-submit');
            const errorDiv = document.getElementById('error-message');

            // Validation
            if (!email || !password) {
                errorDiv.textContent = 'Email and password are required';
                return;
            }

            if (!email.includes('@')) {
                errorDiv.textContent = 'Please enter a valid email';
                return;
            }

            // Disable button to prevent double submission
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing In...';
            errorDiv.textContent = '';

            try {
                const response = await fetch(API_URL + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Store user data in localStorage
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('isLoggedIn', 'true');
                    
                    console.log('Login successful for:', email, 'Role:', data.user.role);
                    // Redirect based on role
                    if (data.user.role === 'doctor') {
                        window.location.href = 'doctor_dashboard.html';
                    } else if (data.user.role === 'pharmacist') {
                        window.location.href = 'pharmacist_portal.html';
                    } else if (data.user.role === 'admin') {
                        window.location.href = 'admin_portal.html';
                    } else {
                        window.location.href = 'patient_dashboard.html';
                    }
                } else {
                    errorDiv.textContent = data.message || 'Invalid Email or Password';
                    console.error('Login failed:', data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                errorDiv.textContent = 'Connection error. Make sure the server is running on localhost:5000';
            } finally {
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });

        document.getElementById('otpForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Here you would verify the OTP with your backend
            window.location.href = 'home.html';
        });

        // Password visibility toggle
        (function() {
            const pwInput = document.getElementById('password');
            const toggle = document.querySelector('.toggle-password');
            if (!pwInput || !toggle) return;
            toggle.addEventListener('click', () => {
                if (pwInput.type === 'password') {
                    pwInput.type = 'text';
                    toggle.textContent = 'Hide';
                } else {
                    pwInput.type = 'password';
                    toggle.textContent = 'Show';
                }
                pwInput.focus();
            });
        })();
    </script>
</body>
</html>
