<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        /* Reusing the Login CSS for consistency */
        :root {
            --primary-color: #4a90e2;
            --primary-hover: #357abd;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #e1e4e8;
            --radius: 8px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
        }

        .login-card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .login-header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .password-wrap {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 13px;
            padding: 6px;
        }

        .success-message {
            display: none;
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #bbf7d0;
            padding: 10px 14px;
            border-radius: 8px;
            text-align: center;
            margin-top: 12px;
            font-weight: 600;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .login-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
        }

        .login-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .top-nav {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hospital-logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
        }

        .nav-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="hospital_landing.html" class="hospital-logo">🏥 Hospital and community Pharmacy management</a>
        <div class="nav-links">
            <a href="hospital_landing.html">Home</a>
            <a href="login.html">Login</a>
        </div>
    </div>
    <div class="login-container">
        <div class="login-card">
            <div id="signup-step">
                <div class="login-header">
                    <h1>Create Account</h1>
                    <p>Sign up to get started</p>
                </div>
                <form id="signupForm">
                    <div class="form-group">
                        <label for="role" class="form-label">I am a:</label>
                        <select id="role" class="form-input" required style="cursor: pointer;">
                            <option value="">-- Select Your Role --</option>
                            <option value="patient">Patient (Book Appointments & View Health Records)</option>
                            <option value="doctor">Doctor (Manage Patients & Prescriptions)</option>
                            <option value="pharmacist">Pharmacist (Manage Medicines & Inventory)</option>
                            <option value="admin">Hospital Admin (Manage Hospital Settings & Users)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fullname" class="form-label">Full Name</label>
                        <input type="text" id="fullname" class="form-input" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-input" placeholder="name@company.com" required>
                    </div>
                    <div class="form-group">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="tel" id="phone" class="form-input" placeholder="+91-9999999999" required>
                    </div>
                    <div class="form-group password-wrap">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" aria-label="Toggle password">Show</button>
                    </div>
                    
                    <!-- Doctor-specific fields -->
                    <div id="doctorFields" style="display: none;">
                        <hr style="margin: 1rem 0; border: none; border-top: 1px solid #ddd;">
                        <h3 style="font-size: 1rem; margin-bottom: 1rem; color: var(--text-main);">Professional Information</h3>
                        <div class="form-group">
                            <label for="specialization" class="form-label">Specialization</label>
                            <select id="specialization" class="form-input" style="cursor: pointer;">
                                <option value="">-- Select Specialization --</option>
                                <option value="Cardiology">Cardiology</option>
                                <option value="Neurology">Neurology</option>
                                <option value="Orthopedics">Orthopedics</option>
                                <option value="Pediatrics">Pediatrics</option>
                                <option value="Gynecology">Gynecology</option>
                                <option value="Dentistry">Dentistry</option>
                                <option value="Ophthalmology">Ophthalmology</option>
                                <option value="General Practice">General Practice</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="license_number" class="form-label">Medical License Number</label>
                            <input type="text" id="license_number" class="form-input" placeholder="MED12345678">
                        </div>
                        <div class="form-group">
                            <label for="experience_years" class="form-label">Years of Experience</label>
                            <input type="number" id="experience_years" class="form-input" placeholder="5" min="0" max="70">
                        </div>
                        <div class="form-group">
                            <label for="consultation_fee" class="form-label">Consultation Fee (in INR)</label>
                            <input type="number" id="consultation_fee" class="form-input" placeholder="500" min="0" step="10">
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">Sign Up</button>
                    <div id="error-message" style="color: #e74c3c; margin-top: 10px; text-align: center; min-height: 20px;"></div>
                    <div id="success-message" class="success-message">Account created successfully — redirecting to login…</div>
                </form>
                <div class="login-footer">
                    <p>Already have an account? <a href="login.html" style="font-size: 16px;">← Back to Login</a></p>
                </div>
            </div>

            <div id="otp-step" style="display: none;">
                <div class="login-header">
                    <h1>Verification</h1>
                    <p>Enter the OTP sent to your email</p>
                </div>
                <form id="otpForm">
                    <div class="form-group">
                        <label for="otp" class="form-label">One-Time Password</label>
                        <input type="text" id="otp" class="form-input" placeholder="123456" required style="text-align: center; letter-spacing: 2px;">
                    </div>
                    <button type="submit" class="btn-submit">Verify & Create Account</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // API URL configuration - Always use localhost:5000
        const API_URL = 'http://localhost:5000';

        // Toggle doctor fields based on role selection
        document.getElementById('role').addEventListener('change', function() {
            const doctorFields = document.getElementById('doctorFields');
            const specializationField = document.getElementById('specialization');
            const licenseField = document.getElementById('license_number');
            const experienceField = document.getElementById('experience_years');
            const feeField = document.getElementById('consultation_fee');
            
            if (this.value === 'doctor') {
                doctorFields.style.display = 'block';
                // Make doctor fields required
                specializationField.setAttribute('required', 'required');
                licenseField.setAttribute('required', 'required');
                experienceField.setAttribute('required', 'required');
                feeField.setAttribute('required', 'required');
            } else {
                doctorFields.style.display = 'none';
                // Remove required from doctor fields
                specializationField.removeAttribute('required');
                licenseField.removeAttribute('required');
                experienceField.removeAttribute('required');
                feeField.removeAttribute('required');
            }
        });

        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const role = document.getElementById('role').value.trim();
            const fullname = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.querySelector('.btn-submit');
            const errorDiv = document.getElementById('error-message');

            // Validation
            if (!role) {
                errorDiv.textContent = 'Please select your role (Patient or Doctor)';
                return;
            }

            if (!fullname || fullname.length < 3) {
                errorDiv.textContent = 'Full name is required and must be at least 3 characters';
                return;
            }

            if (!email || !email.includes('@')) {
                errorDiv.textContent = 'Please enter a valid email address';
                return;
            }

            if (!phone || phone.length < 10) {
                errorDiv.textContent = 'Please enter a valid phone number';
                return;
            }

            if (!password || password.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters';
                return;
            }

            let signupData = {
                fullname,
                email,
                phone,
                password,
                role
            };

            // Add doctor-specific fields if role is doctor
            if (role === 'doctor') {
                const specialization = document.getElementById('specialization').value.trim();
                const license_number = document.getElementById('license_number').value.trim();
                const experience_years = document.getElementById('experience_years').value;
                const consultation_fee = document.getElementById('consultation_fee').value;

                if (!specialization) {
                    errorDiv.textContent = 'Please select your specialization';
                    return;
                }

                if (!license_number || license_number.length < 5) {
                    errorDiv.textContent = 'Please enter a valid medical license number';
                    return;
                }

                if (!experience_years || experience_years < 0) {
                    errorDiv.textContent = 'Please enter your years of experience';
                    return;
                }

                if (!consultation_fee || consultation_fee < 100) {
                    errorDiv.textContent = 'Please enter a consultation fee (minimum 100 INR)';
                    return;
                }

                signupData = {
                    ...signupData,
                    specialization,
                    license_number,
                    experience_years: parseInt(experience_years),
                    consultation_fee: parseInt(consultation_fee)
                };
            }

            // Disable button to prevent double submission
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating Account...';
            errorDiv.textContent = '';

            try {
                const response = await fetch(API_URL + '/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(signupData)
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Show inline success message and redirect after short delay
                    const success = document.getElementById('success-message');
                    if (success) {
                        success.style.display = 'block';
                    }
                    console.log('✅ Signup successful for:', email);
                    setTimeout(() => window.location.href = 'login.html', 1200);
                } else {
                    errorDiv.textContent = data.message || 'Registration failed. Please try again.';
                    console.error('Signup failed:', data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                errorDiv.textContent = 'Connection error. Make sure the server is running on localhost:5000';
            } finally {
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign Up';
            }
        });

        document.getElementById('otpForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Here you would verify the OTP with your backend
            window.location.href = 'home.html';
        });

        // Password visibility toggle for signup
        (function() {
            const pwInput = document.getElementById('password');
            const toggle = document.querySelector('.toggle-password');
            if (!pwInput || !toggle) return;
            toggle.addEventListener('click', () => {
                if (pwInput.type === 'password') {
                    pwInput.type = 'text';
                    toggle.textContent = 'Hide';
                } else {
                    pwInput.type = 'password';
                    toggle.textContent = 'Show';
                }
                pwInput.focus();
            });
        })();
    </script>
</body>
</html>
